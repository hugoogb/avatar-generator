name: CI

on:
    push:
        branches: [master, develop]
    pull_request:
        branches: [master, develop]

jobs:
    lint:
        name: Lint & Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install root dependencies
              run: pnpm install

            - name: Lint & format
              run: pnpm run check

    test:
        name: Test & Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies (workspace)
              run: pnpm install
              working-directory: src

            - name: Typecheck tests
              run: pnpm run typecheck
              working-directory: src

            - name: Run tests with coverage
              run: pnpm run test:coverage
              working-directory: src

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage
                  path: src/coverage/
                  retention-days: 14

    build-packages:
        name: Build packages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies (workspace)
              run: pnpm install
              working-directory: src

            - name: Build all packages
              run: pnpm run build
              working-directory: src

    build-docs:
        name: Build docs
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install docs dependencies
              run: pnpm install
              working-directory: docs

            - name: Build docs site
              run: pnpm run build
              working-directory: docs
